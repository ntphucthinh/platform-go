openapi: 3.0.3
info:
  title: My Project API
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
- description: Local Development Server
  url: https://api.platform.internal:8445
tags:
- description: Cookie-based authentication
  name: auth
- description: User management
  name: users
- description: Homestay management
  name: homestays
- description: Generic media upload management
  name: uploads
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: "Authenticated; access, refresh and CSRF cookies are set. Send\
            \ csrfToken as X-CSRF-Token on authenticated requests."
        "400":
          description: Invalid request
        "401":
          description: Invalid credentials
      summary: Sign in as an administrator
      tags:
      - auth
  /auth/refresh:
    post:
      operationId: refresh
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: "Access, refresh and CSRF cookies are rotated. Update the frontend\
            \ CSRF token from the response."
        "401":
          description: Invalid refresh token
      security:
      - RefreshCookie: []
      summary: Refresh authentication cookies
      tags:
      - auth
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Logged out
      security:
      - AccessCookie: []
      summary: Clear authentication cookies
      tags:
      - auth
  /auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginUser"
          description: Current user
        "401":
          description: Unauthenticated
      security:
      - AccessCookie: []
      summary: Get the currently authenticated administrator
      tags:
      - auth
  /users:
    get:
      operationId: get-users
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/User"
                type: array
          description: OK
      summary: Get users
      tags:
      - users
    post:
      operationId: create-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Created
      summary: Create a user
      tags:
      - users
  /homestays:
    get:
      description: Retrieve a list of homestays with their rooms and images.
      operationId: fetchHomestays
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetchHomestays_200_response"
          description: Homestays retrieved successfully
        "500":
          description: Internal server error
      summary: Get homestay list
      tags:
      - Homestays
  /uploads:
    delete:
      operationId: deleteUploads
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUploadsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUploadsResponse"
          description: Deletion results
        "400":
          description: Invalid delete request
        "401":
          description: Unauthenticated
        "403":
          description: CSRF validation failed
        "502":
          description: Upload provider failure
      security:
      - AccessCookie: []
      summary: Delete unused uploaded files
      tags:
      - uploads
    post:
      operationId: uploadFiles
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadFiles_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
          description: Files uploaded successfully
        "400":
          description: Invalid upload request
        "401":
          description: Unauthenticated
        "403":
          description: CSRF validation failed
        "502":
          description: Upload provider failure
      security:
      - AccessCookie: []
      summary: "Upload images, GIFs, or videos"
      tags:
      - uploads
components:
