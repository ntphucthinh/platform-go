openapi: 3.0.3
info:
  title: My Project API
  version: 1.0.0
servers:
  - url: https://api.platform.internal:8445
    description: Local Development Server
tags:
  - name: auth
    description: Cookie-based authentication
  - name: users
    description: User management
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
paths:
  /auth/login:
    post:
      summary: Sign in as an administrator
      operationId: login
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; access, refresh and CSRF cookies are set. Send csrfToken as X-CSRF-Token on authenticated requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid credentials
  /auth/refresh:
    post:
      summary: Refresh authentication cookies
      operationId: refresh
      tags:
        - auth
      security:
        - RefreshCookie: []
      responses:
        '200':
          description: Access, refresh and CSRF cookies are rotated. Update the frontend CSRF token from the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid refresh token
  /auth/logout:
    post:
      summary: Clear authentication cookies
      operationId: logout
      tags:
        - auth
      security:
        - AccessCookie: []
      responses:
        '204':
          description: Logged out
  /auth/me:
    get:
      summary: Get the currently authenticated administrator
      operationId: me
      tags:
        - auth
      security:
        - AccessCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUser'
        '401':
          description: Unauthenticated
  /users:
    get:
      summary: Get users
      operationId: get-users
      tags:
        - users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create a user
      operationId: create-user
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUser:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponseData:
      type: object
      required:
        - csrfToken
      properties:
        csrfToken:
          type: string
    AuthResponse:
      type: object
      required:
        - data
        - message
      properties:
        data:
          $ref: '#/components/schemas/AuthResponseData'
        message:
          type: string
    LoginUser:
      type: object
      required:
        - id
        - name
        - email
        - accountType
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        accountType:
          type: string
          example: admin
  securitySchemes:
    AccessCookie:
      type: apiKey
      in: cookie
      name: jwt
      description: Access JWT stored in an HttpOnly cookie.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh JWT stored in an HttpOnly cookie.
