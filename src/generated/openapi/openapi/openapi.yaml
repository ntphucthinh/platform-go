          x-go-name: Address
          x-oapi-codegen-extra-tags:
            binding: "required,min=1,max=255"
        description:
          description: General description
          example: Cozy homestay with mountain view
          nullable: true
          type: string
          x-order: 3
          x-go-name: Description
          x-oapi-codegen-extra-tags:
            binding: omitempty
        googleMapsUrl:
          description: Google Maps URL
          example: https://www.google.com/maps
