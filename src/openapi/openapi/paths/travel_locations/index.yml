get:
  operationId: fetchTravelLocations
  tags:
    - travelLocations
  summary: Get travel location list
  description: Retrieve all travel locations with optional filtering and total count.
  security:
    - AccessCookie: []
  parameters:
    - name: status
      in: query
      required: false
      description: Filter by travel location status (visited or wishlist)
      x-oapi-codegen-extra-tags:
        binding: "omitempty,oneof=visited wishlist"
      schema:
        $ref: "../../components/schemas/enum/travel_location_status.yml#/TravelLocationStatus"
    - name: countryCode
      in: query
      required: false
      description: Filter by ISO 3166-1 alpha-2 country code
      schema:
        type: string
  responses:
    "200":
      description: Travel locations retrieved successfully
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/travel_locations/index.yml#/FetchTravelLocationsResponse"
post:
  operationId: createTravelLocation
  tags:
    - travelLocations
  summary: Create a new travel location
  description: Create a new travel location. Validates countryCode.
  security:
    - AccessCookie: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/travel_locations/index.yml#/CreateTravelLocationRequest"
  responses:
    "200":
      description: Travel location created successfully
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/message.yml#/MessageOnlyResponse"

