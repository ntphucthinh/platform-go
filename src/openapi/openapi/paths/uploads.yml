post:
  operationId: uploadFiles
  tags: [uploads]
  summary: Upload images, GIFs, or videos
  security:
    - AccessCookie: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required: [files, folder]
          properties:
            files:
              type: array
              items:
                type: string
                format: binary
            folder:
              type: string
              enum: [homestays, travel]
  responses:
    '200':
      description: Files uploaded successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/uploads.yml#/UploadResponse'
    '400': {description: Invalid upload request}
    '401': {description: Unauthenticated}
    '403': {description: CSRF validation failed}
    '502': {description: Upload provider failure}
delete:
  operationId: deleteUploads
  tags: [uploads]
  summary: Delete unused uploaded files
  security:
    - AccessCookie: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/uploads.yml#/DeleteUploadsRequest'
  responses:
    '200':
      description: Deletion results
      content:
        application/json:
          schema:
            $ref: '../components/schemas/uploads.yml#/DeleteUploadsResponse'
    '400': {description: Invalid delete request}
    '401': {description: Unauthenticated}
    '403': {description: CSRF validation failed}
    '502': {description: Upload provider failure}
