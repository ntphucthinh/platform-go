post:
  operationId: uploadFiles
  tags: [uploads]
  summary: Upload images, GIFs, or videos
  security:
    - AccessCookie: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required: [files, folder]
          properties:
            files:
              type: array
              items:
                type: string
                format: binary
            folder:
              type: string
              enum: [homestays, travel_location]
  responses:
    "200":
      description: Files uploaded successfully
      content:
        application/json:
          schema:
            $ref: "../components/schemas/uploads.yml#/UploadResponse"
delete:
  operationId: deleteUploads
  tags: [uploads]
  summary: Delete unused uploaded files
  security:
    - AccessCookie: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/uploads.yml#/DeleteUploadsRequest"
  responses:
    "200":
      description: Deletion results
      content:
        application/json:
          schema:
            $ref: "../components/schemas/uploads.yml#/DeleteUploadsResponse"
