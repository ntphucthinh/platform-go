get:
  operationId: fetchHomestays
  tags:
    - Homestays
  summary: Get homestay list
  description: Retrieve a list of homestays with their rooms and images.
  parameters:
    - $ref: "../../components/schemas/common/query_pagination.yml#/Page"
    - $ref: "../../components/schemas/common/query_pagination.yml#/PerPage"
  responses:
    "200":
      description: Homestays retrieved successfully
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/homestays/index.yml#/FetchHomestayResponse"
post:
  operationId: createHomestay
  tags:
    - Homestays
  summary: Create a homestay
  description: |
    Create a homestay together with its rooms and images in a single transaction.
    Image paths must be obtained beforehand via `POST /uploads` (folder `homestays`).
  security:
    - AccessCookie: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/homestays/index.yml#/CreateHomestayRequest"
  responses:
    "200":
      description: Homestay created successfully
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/message.yml#/MessageOnlyResponse"
