FetchHomestayResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
      example: 28
    name:
      type: string
      example: Green Pine Homestay
    address:
      type: string
      example: 12 Tran Phu, Da Lat
    description:
      type: string
      nullable: true
      example: Cozy homestay with garden view
    google_maps_url:
      type: string
      nullable: true
      format: uri
      example: https://www.google.com/maps
    homestay_rooms:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            format: int64
            example: 17
          homestay_id:
            type: integer
            format: int64
            example: 28
          name:
            type: string
            example: Room 1
          description:
            type: string
            nullable: true
            example: Deluxe double room with balcony
          sort_order:
            type: integer
            format: int32
            example: 1
          price_amount:
            type: number
            format: double
            example: 10000.00
          price_unit:
            type: string
            example: per_room_per_night
          homestay_images:
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                  example: 178
                room_id:
                  type: integer
                  format: int64
                  example: 17
                image_path:
                  type: string
                  example: homestays/28/1792554894062_zbd0lt_halo.png
                sort_order:
                  type: integer
                  format: int32
                  example: 1
                is_cover:
                  type: boolean
                  example: true
              required:
                - id
                - room_id
                - image_path
                - sort_order
                - is_cover
        required:
          - id
          - homestay_id
          - name
          - sort_order
          - homestay_images
  required:
    - id
    - name
    - address
    - homestay_rooms

