SelectionTravelLocationResponse:
  type: object
  properties:
    data:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            format: int64
            description: "Tourist attraction ID"
            example: 1
          name:
            type: string
            description: "Tourist attraction name"
        required:
          - id
          - name
  required:
    - data
