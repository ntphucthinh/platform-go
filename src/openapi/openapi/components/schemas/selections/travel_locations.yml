SelectionTravelLocationResponse:
  type: object
  properties:
    data:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            format: int64
            description: "Tourist attraction ID"
            example: 1
          name:
            type: string
            description: "Tourist attraction name"
          countryCode:
            type: string
            description: "Country code (ISO 3166-1 alpha-2)"
            example: "VN"
        required:
          - id
          - name
          - countryCode
  required:
    - data
