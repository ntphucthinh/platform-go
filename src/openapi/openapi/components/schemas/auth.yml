LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
LoginUser:
  type: object
  required: [id, name, email, accountType]
  properties:
    id: {type: integer, format: int64}
    name: {type: string}
    email: {type: string, format: email}
    accountType: {type: string, example: admin}
AuthResponse:
  type: object
  required: [data, message]
  properties:
    data:
      $ref: '#/AuthResponseData'
    message: {type: string}
AuthResponseData:
  type: object
  required: [csrfToken]
  properties:
    csrfToken: {type: string}
