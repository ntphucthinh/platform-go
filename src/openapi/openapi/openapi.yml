openapi: 3.0.3
info:
  title: My Project API
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: https://api.platform.internal:8445
    description: Local Development Server
tags:
  - name: auth
    description: Cookie-based authentication
  - name: users
    description: User management
  - name: homestays
    description: Homestay management
  - name: travelLocations
    description: Travel location management
  - name: uploads
    description: Generic media upload management

paths:
  /auth/login:
    $ref: "./paths/auth.yml#/~1login"
  /auth/refresh:
    $ref: "./paths/auth.yml#/~1refresh"
  /auth/logout:
    $ref: "./paths/auth.yml#/~1logout"
  /auth/me:
    $ref: "./paths/auth.yml#/~1me"
  /users:
    $ref: "./paths/users.yml"
  /homestays:
    $ref: "./paths/homestays/index.yml"
  /homestays/{homestayID}:
    $ref: "./paths/homestays/:homestayID.yml"
  /travel-locations:
    $ref: "./paths/travel_locations/index.yml"
  /travel-locations/{travelLocationID}:
    $ref: "./paths/travel_locations/:travelLocationID.yml"
  /uploads:
    $ref: "./paths/uploads.yml"

components:
  securitySchemes:
    AccessCookie:
      type: apiKey
      in: cookie
      name: jwt
      description: Access JWT stored in an HttpOnly cookie.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh JWT stored in an HttpOnly cookie.
  schemas:
    User:
      $ref: "./components/schemas/user.yml#/User"
    CreateUser:
      $ref: "./components/schemas/user.yml#/CreateUser"
    UploadResponse:
      $ref: "./components/schemas/uploads.yml#/UploadResponse"
    DeleteUploadsRequest:
      $ref: "./components/schemas/uploads.yml#/DeleteUploadsRequest"
    DeleteUploadsResponse:
      $ref: "./components/schemas/uploads.yml#/DeleteUploadsResponse"
    FetchHomestayResponse:
      $ref: "./components/schemas/homestays/index.yml#/FetchHomestayResponse"
    FetchHomestayByIDResponse:
      $ref: "./components/schemas/homestays/:homestayID.yml#/FetchHomestayByIDResponse"
    CreateHomestayRequest:
      $ref: "./components/schemas/homestays/index.yml#/CreateHomestayRequest"
    UpdateHomestayRequest:
      $ref: "./components/schemas/homestays/:homestayID.yml#/UpdateHomestayRequest"
    PriceUnit:
      $ref: "./components/schemas/enum/price_unit.yml#/PriceUnit"
    TravelLocationStatus:
      $ref: "./components/schemas/enum/travel_location_status.yml#/TravelLocationStatus"
    FetchTravelLocationsResponse:
      $ref: "./components/schemas/travel_locations/index.yml#/FetchTravelLocationsResponse"
    FetchTravelLocationByIDResponse:
      $ref: "./components/schemas/travel_locations/:travelLocationID.yml#/FetchTravelLocationByIDResponse"
    MessageOnlyResponse:
      $ref: "./components/schemas/common/message.yml#/MessageOnlyResponse"
    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    MessageErrorResponse:
      type: object
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageErrorResponse"
          example:
            message: "Authentication error"

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageErrorResponse"
          example:
            message: "Permission denied"

    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageErrorResponse"
          example:
            message: "Resource not found"

    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageErrorResponse"
          example:
            message: "An error occurred"
